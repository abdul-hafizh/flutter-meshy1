org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Works around a known Windows-only Kotlin Build Tools API bug ("Could not
# close incremental caches") where antivirus/file-locking on the .tab cache
# files under build/ intermittently breaks incremental compilation. Full
# recompiles are slower but reliable. Safe to remove if upgrading Kotlin
# fixes it upstream.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template. Kept off:
# several transitive plugins (desktop_drop, device_info_plus,
# package_info_plus, photo_manager, record_android, share_plus,
# wakelock_plus, android_intent_plus) still unconditionally self-apply the
# legacy Kotlin Gradle Plugin, which hard-conflicts with AGP 9's built-in
# Kotlin when both are active for the same module. file_picker (also
# transitive, via stream_chat_flutter) is the one exception that needs
# built-in Kotlin specifically — see android/build.gradle.kts, which forces
# it on for just that module.
android.builtInKotlin=false
